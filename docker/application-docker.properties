# Docker Profile Configuration for The Game of Life 2
# This file is used when running in Docker containers

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://postgres:5432/life2_games
spring.datasource.username=life2_user
spring.datasource.password=life2_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis Configuration
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=60000

# Server Configuration
server.port=8080

# Logging
logging.level.com.boardgame=INFO
logging.level.org.springframework.web=INFO

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized