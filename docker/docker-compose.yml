version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/life2
    depends_on:
      - db
    networks:
      - life2-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - life2-network

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=life2
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - life2-network

networks:
  life2-network:
    driver: bridge

volumes:
  postgres-data: